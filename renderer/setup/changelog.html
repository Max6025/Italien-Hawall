<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hawall – Changelog</title>
<link rel="stylesheet" href="/shared/nav.css">
<link rel="stylesheet" href="style.css">
<style>
  .cl-page { max-width: 720px; margin: 0 auto; }
  .cl-intro { color: #666; font-size: 0.95rem; margin-bottom: 2rem; }
  .cl-timeline { position: relative; }
  .cl-entry { display: flex; gap: 1.4rem; margin-bottom: 1.6rem; }
  .cl-marker { display: flex; flex-direction: column; align-items: center; width: 70px; flex-shrink: 0; padding-top: 0.3rem; }
  .cl-marker .dot { width: 10px; height: 10px; border-radius: 50%; background: #4f7cff; }
  .cl-marker .date { font-size: 0.78rem; color: #888; margin-top: 0.4rem; text-align: center; white-space: nowrap; }
  .cl-marker .line { flex: 1; width: 1px; background: #e2e4e8; margin-top: 0.4rem; }

  .cl-major {
    flex: 1; border-radius: 16px; padding: 1.8rem 2rem; color: #fff; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #4f7cff 0%, #7c5cff 45%, #ff8f6b 100%);
  }
  .cl-major .cl-version-big { position: absolute; right: 1.4rem; top: 1rem; font-size: 3.4rem; font-weight: 800;
    opacity: 0.35; line-height: 1; }
  .cl-major h2 { margin: 0 0 0.2rem; font-size: 1.3rem; color: #fff; }
  .cl-major .cl-title { font-size: 0.95rem; opacity: 0.92; margin-bottom: 1rem; }
  .cl-major h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.4px; opacity: 0.85; margin: 1rem 0 0.4rem; }
  .cl-major ul { margin: 0; padding-left: 1.2rem; }
  .cl-major li { margin-bottom: 0.3rem; font-size: 0.9rem; }

  .cl-minor { flex: 1; padding: 0.2rem 0; }
  .cl-minor .cl-minor-head { font-size: 0.92rem; font-weight: 600; color: #1a1c20; }
  .cl-minor .cl-minor-head .v { color: #4f7cff; font-weight: 700; margin-right: 0.5rem; }
  .cl-minor ul { margin: 0.4rem 0 0; padding-left: 1.1rem; color: #555; font-size: 0.85rem; }
  .cl-minor li { margin-bottom: 0.15rem; }
</style>
</head>
<body>
  <nav class="hawall-nav">
    <div class="hawall-nav-brand"><span class="hawall-logo">H</span> Hawall</div>
    <div class="hawall-nav-links">
      <a href="index.html">Verbindung</a>
      <a href="editor.html">Karten</a>
      <a href="screensaver.html">Screensaver</a>
      <a href="theme.html">Einstellungen</a>
      <a href="design-import.html">Design-Import</a>
      <a href="dashboards.html">Unterdashboards</a>
      <a href="update.html">Update</a>
      <a href="changelog.html">Changelog</a>
    </div>
  </nav>
  <div class="page-content">
    <div class="cl-page">
      <h1 style="font-size:1.6rem;">Changelog</h1>
      <p class="cl-intro">Alle Neuerungen und Fehlerbehebungen von Hawall.</p>
      <div class="cl-timeline" id="timeline"></div>
    </div>
  </div>
  <script src="changelog-data.js"></script>
  <script src="/shared/nav.js"></script>
  <script>
    const timeline = document.getElementById('timeline');
    const fmtDate = d => new Date(d).toLocaleDateString('de-DE', { day: '2-digit', month: 'short', year: 'numeric' });
    (window.HAWALL_CHANGELOG || []).forEach(entry => {
      const row = document.createElement('div');
      row.className = 'cl-entry';
      const marker = `<div class="cl-marker"><div class="dot"></div><div class="date">${fmtDate(entry.date)}</div><div class="line"></div></div>`;
      if (entry.type === 'major') {
        row.innerHTML = `${marker}
          <div class="cl-major">
            <div class="cl-version-big">${entry.version.split('.')[1]}</div>
            <h2>Version ${entry.version}</h2>
            <div class="cl-title">${entry.title}</div>
            ${entry.improvements && entry.improvements.length ? `<h3>Neuerungen</h3><ul>${entry.improvements.map(i => `<li>${i}</li>`).join('')}</ul>` : ''}
            ${entry.bugfixes && entry.bugfixes.length ? `<h3>Bugfixes</h3><ul>${entry.bugfixes.map(i => `<li>${i}</li>`).join('')}</ul>` : ''}
          </div>`;
      } else {
        row.innerHTML = `${marker}
          <div class="cl-minor">
            <div class="cl-minor-head"><span class="v">${entry.version}</span>${entry.title}</div>
            ${entry.improvements && entry.improvements.length ? `<ul>${entry.improvements.map(i => `<li>${i}</li>`).join('')}</ul>` : ''}
            ${entry.bugfixes && entry.bugfixes.length ? `<ul>${entry.bugfixes.map(i => `<li>${i}</li>`).join('')}</ul>` : ''}
          </div>`;
      }
      timeline.appendChild(row);
    });
  </script>
</body>
</html>
