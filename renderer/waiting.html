<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Bereit zum Einrichten</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    -webkit-user-select: none;
  }
  .box { text-align: center; }
  .title { font-size: 2.4vw; font-weight: 300; margin-bottom: 1.5vw; letter-spacing: 0.5px; }
  .ip { font-size: 4vw; font-weight: 600; letter-spacing: 1px; }
  .hint { font-size: 1.2vw; opacity: 0.6; margin-top: 1.5vw; }
</style>
</head>
<body>
  <div class="box">
    <div class="title">Bereit zum Einrichten</div>
    <div class="ip" id="ip">IP: ...</div>
    <div class="hint">Auf einem anderen Geraet im Browser diese Adresse oeffnen, um einzurichten.</div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const ips = (params.get('ips') || '').split(',').filter(Boolean);
    const port = params.get('port') || '8787';
    const target = ips.length ? ips.map(ip => `${ip}:${port}/setup/`).join('  /  ') : `localhost:${port}/setup/`;
    document.getElementById('ip').textContent = `IP: ${target}`;
  </script>
</body>
</html>
